name: Static audit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit website assets and links
        run: node scripts/audit-static-site.mjs
      - name: Verify private files are excluded from static assets
        run: node scripts/check-assetsignore.mjs
      - name: Install private app test dependencies
        run: npm install --prefix app --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Test appointment intake and Worker security
        run: node scripts/test-worker.mjs
