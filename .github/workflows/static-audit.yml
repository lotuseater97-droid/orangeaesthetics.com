name: Static audit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit website assets and links
        run: node scripts/audit-static-site.mjs
      - name: Test appointment intake and Worker security
        run: node scripts/test-worker.mjs
