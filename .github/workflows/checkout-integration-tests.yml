name: Checkout integration tests
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/lib/**'
      - 'app/migrations/**'
      - 'app/tests/**'
      - 'app/server/index.mjs'
      - 'app/server/package.json'
      - 'app/package.json'
      - '.github/workflows/checkout-integration-tests.yml'
  pull_request:
    paths:
      - 'app/lib/**'
      - 'app/migrations/**'
      - 'app/tests/**'
      - 'app/server/index.mjs'
      - 'app/server/package.json'
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and server dependencies
        run: |
          npm install --prefix app --no-audit --no-fund
          npm install --prefix app/server --no-audit --no-fund
      - name: Verify all test modules parse
        run: |
          for file in app/tests/*.test.mjs; do node --check "$file"; done
      - name: Run complete application test suite
        run: |
          set -o pipefail
          node --test --test-reporter=tap app/tests/*.test.mjs | tee checkout-test-results.tap
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-test-results
          path: checkout-test-results.tap
          if-no-files-found: warn
