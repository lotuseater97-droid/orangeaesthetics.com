name: Business foundation tests
on:
  push:
    paths:
      - 'app/lib/**'
      - 'app/tests/**'
      - '.github/workflows/business-foundation-tests.yml'
  pull_request:
    paths:
      - 'app/lib/**'
      - 'app/tests/**'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run business policy tests
        run: node --test app/tests/business-operations.test.mjs app/tests/workflow-rules.test.mjs app/tests/business-api.test.mjs app/tests/business-csv.test.mjs app/tests/reconciliation.test.mjs app/tests/notification-outbox.test.mjs app/tests/booking-capacity.test.mjs app/tests/inventory-control.test.mjs app/tests/membership-operations.test.mjs app/tests/staff-operations.test.mjs app/tests/purchasing-controls.test.mjs app/tests/owner-prototype.test.mjs app/tests/business-service.test.mjs app/tests/transactional-business-service.test.mjs app/tests/idempotency-fingerprint.test.mjs app/tests/owner-read-service.test.mjs
