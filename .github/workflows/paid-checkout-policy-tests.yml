name: Paid checkout policy tests
on:
  push:
    paths:
      - "app/lib/paid-checkout-policy.mjs"
      - "app/tests/paid-checkout-policy.test.mjs"
      - ".github/workflows/paid-checkout-policy-tests.yml"
  pull_request:
    paths:
      - "app/lib/paid-checkout-policy.mjs"
      - "app/tests/paid-checkout-policy.test.mjs"
      - ".github/workflows/paid-checkout-policy-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test app/tests/paid-checkout-policy.test.mjs
