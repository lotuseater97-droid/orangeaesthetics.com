name: Production smoke test
on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production public and private routes
        shell: bash
        run: |
          set -o pipefail
          echo "## Production route and security smoke test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Run time (UTC): '$(date -u '+%Y-%m-%d %H:%M:%S') >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
          set +e
          node scripts/smoke-production.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          result=${PIPESTATUS[0]}
          set -e
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
